openapi: 3.1.0

info:
  title: Whimo API
  description: |
    API documentation for the Whimo application.

    Harvest season rules the whole contract rests on:

    - A transaction carries exactly one harvest season. There is no partial distribution between seasons,
      so volume held in several seasons is moved by several transactions.
    - The season is chosen by whoever creates the transaction, buyer or seller alike, and is never changed
      afterwards. Accepting or rejecting never selects, splits or edits a season.
    - Balance records are kept per commodity and season. The flat balance endpoint never combines seasons;
      the grouped catalogue may sum them only when the caller omits its season filters.
    - A shortfall of the seller balance is covered by an automatic balance adjustment only in the active
      season. In a past or archived season the transaction simply cannot be accepted until the seller
      raises the balance.
    - A traceability chain never crosses a season boundary.
  version: 1.0.0

servers:
  - url: https://staging.whimo.net/api/v1
    description: Staging API V1
  - url: https://whimo.net/api/v1
    description: Production API V1
  - url: https://whimo.krasnopolsky.dev/api/v1
    description: Dev API V1
  - url: http://127.0.0.1:8000/api/v1
    description: Local API V1

paths:
  /system/healthcheck/:
    get:
      tags: [ System ]
      security: [ ]
      summary: Healthcheck
      description: Checks the health of the system
      operationId: healthcheck
      responses:
        '200':
          $ref: './components/system/responses.yaml#/HealthcheckResponse'

  /languages/:
    get:
      tags: [ System ]
      security: [ ]
      summary: List languages
      description: Languages enabled in the admin, in picker order, and the default one. Public and cached for 5 minutes.
      operationId: listLanguages
      responses:
        '200':
          $ref: './components/languages/responses.yaml#/LanguagesResponse'

  /languages/{code}/{platform}/:
    get:
      tags: [ System ]
      security: [ ]
      summary: Get uploaded strings
      description: Strings an administrator uploaded for one platform of an enabled language. Public and cached for 5 minutes.
      operationId: getLanguageStrings
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: hi
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ web, android, ios, api ]
      responses:
        '200':
          $ref: './components/languages/responses.yaml#/LanguageStringsResponse'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /auth/registration/:
    post:
      tags: [ Registration ]
      security: [ ]
      summary: Register new user
      description: Creates a new user account with email, phone, or both
      operationId: registerUser
      requestBody:
        $ref: './components/auth/registration/requests.yaml#/RegistrationRequest'
      responses:
        '201':
          $ref: './components/auth/registration/responses.yaml#/RegisteredResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '409':
          $ref: './components/auth/registration/errors.yaml#/GadgetAlreadyExistsError'

  /auth/social/google/login/:
    post:
      tags: [ Social ]
      security: [ ]
      summary: Google OAuth login
      description: Authorize Google OAuth ID token
      operationId: googleLogin
      requestBody:
        $ref: './components/auth/social/requests.yaml#/OAuthIdTokenRequest'
      responses:
        '200':
          $ref: './components/auth/jwt/responses.yaml#/TokenPairResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/social/apple/login/:
    post:
      tags: [ Social ]
      security: [ ]
      summary: Apple OAuth login
      description: Authorize Apple OAuth ID token
      operationId: appleLogin
      requestBody:
        $ref: './components/auth/social/requests.yaml#/OAuthIdTokenRequest'
      responses:
        '200':
          $ref: './components/auth/jwt/responses.yaml#/TokenPairResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/social/google/web/login/:
    post:
      tags: [ Social ]
      security: [ ]
      summary: Google OAuth web login
      description: Authorize Google OAuth authorization code
      operationId: googleWebLogin
      requestBody:
        $ref: './components/auth/social/requests.yaml#/OAuthCodeRequest'
      responses:
        '200':
          $ref: './components/auth/jwt/responses.yaml#/TokenPairResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/social/apple/web/login/:
    post:
      tags: [ Social ]
      security: [ ]
      summary: Apple OAuth web login
      description: Authorize Apple OAuth authorization code
      operationId: appleWebLogin
      requestBody:
        $ref: './components/auth/social/requests.yaml#/OAuthCodeRequest'
      responses:
        '200':
          $ref: './components/auth/jwt/responses.yaml#/TokenPairResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/jwt/:
    post:
      tags: [ JWT ]
      security: [ ]
      summary: Obtain JWT token pair
      description: Creates access and refresh tokens
      operationId: obtainTokenPair
      requestBody:
        $ref: './components/auth/jwt/requests.yaml#/TokenObtainRequest'
      responses:
        '200':
          $ref: './components/auth/jwt/responses.yaml#/TokenPairResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/jwt/refresh/:
    post:
      tags: [ JWT ]
      security: [ ]
      summary: Refresh JWT token pair
      description: Refreshes access and refresh tokens
      operationId: refreshToken
      requestBody:
        $ref: './components/auth/jwt/requests.yaml#/TokenRefreshRequest'
      responses:
        '200':
          $ref: './components/auth/jwt/responses.yaml#/TokenPairResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/otp/send/:
    post:
      tags: [ OTP ]
      security: [ ]
      summary: Send OTP code
      description: Sends a one-time password to a user's gadget
      operationId: sendOTP
      requestBody:
        $ref: './components/auth/otp/requests.yaml#/OTPSendRequest'
      responses:
        '200':
          $ref: './components/auth/otp/responses.yaml#/OTPSentResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '429':
          $ref: './components/common/errors.yaml#/TooManyRequestsError'

  /auth/otp/verify/:
    post:
      tags: [ OTP ]
      security: [ ]
      summary: Verify OTP code
      description: Verifies a one-time password code for a user gadget
      operationId: verifyOTP
      requestBody:
        $ref: './components/auth/otp/requests.yaml#/OTPVerifyRequest'
      responses:
        '200':
          $ref: './components/auth/otp/responses.yaml#/OTPVerifiedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /auth/otp/password-reset/send/:
    post:
      tags: [ OTP ]
      summary: Send password reset code
      description: Sends a password reset code to a user's gadget
      operationId: sendPasswordResetCode
      security: [ ]
      requestBody:
        $ref: './components/auth/otp/requests.yaml#/PasswordResetSendRequest'
      responses:
        '200':
          $ref: './components/auth/otp/responses.yaml#/PasswordResetSentResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '429':
          $ref: './components/common/errors.yaml#/TooManyRequestsError'

  /auth/otp/password-reset/check/:
    post:
      tags: [ OTP ]
      security: [ ]
      summary: Check password reset code
      description: Checks a password reset code
      operationId: checkPasswordResetCode
      requestBody:
        $ref: './components/auth/otp/requests.yaml#/PasswordResetCheckRequest'
      responses:
        '200':
          $ref: './components/auth/otp/responses.yaml#/PasswordResetOTPValidResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'

  /auth/otp/password-reset/verify/:
    post:
      tags: [ OTP ]
      security: [ ]
      summary: Verify password reset code and set new password
      description: Verifies a password reset code and sets a new password
      operationId: verifyPasswordResetCode
      requestBody:
        $ref: './components/auth/otp/requests.yaml#/PasswordResetVerifyRequest'
      responses:
        '200':
          $ref: './components/auth/otp/responses.yaml#/PasswordResetResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /users/profile/:
    get:
      tags: [ Users ]
      summary: Get user profile
      description: Returns the authenticated user's profile with their gadgets
      operationId: getUserProfile
      responses:
        '200':
          $ref: './components/users/responses.yaml#/ProfileResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
    delete:
      tags: [ Users ]
      summary: Delete user account
      description: Deletes the user's account
      operationId: deleteUserProfile
      responses:
        '200':
          $ref: './components/users/responses.yaml#/ProfileDeletedResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /users/profile/password/:
    patch:
      tags: [ Users ]
      summary: Change user password
      description: Changes the user's password
      operationId: changeUserPassword
      requestBody:
        $ref: './components/users/requests.yaml#/PasswordChangeRequest'
      responses:
        '200':
          $ref: './components/users/responses.yaml#/PasswordChangedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /users/exists/:
    get:
      tags: [ Users ]
      summary: Check if a User ID exists
      description: |
        Checks whether a User ID belongs to an account that can receive a transaction, so the app can mark the
        field while it is being filled instead of failing at the end of the flow. Deleted accounts read false,
        and a transaction addressed to one is refused with transactions.recipient_not_found.
      operationId: checkUserExists
      parameters:
        - $ref: './components/users/parameters.yaml#/UsernameParameter'
      responses:
        '200':
          $ref: './components/users/responses.yaml#/UserExistsResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /users/gadgets/exists/:
    get:
      tags: [ Users ]
      summary: Check if gadget exists
      description: Checks if a gadget identifier (email or phone) exists
      operationId: checkGadgetExists
      parameters:
        - $ref: './components/users/parameters.yaml#/GadgetIdentifierParameter'
      responses:
        '200':
          $ref: './components/users/responses.yaml#/GadgetExistsResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

  /users/gadgets/:
    post:
      tags: [ Users ]
      summary: Create user gadget
      description: Creates a new gadget (email or phone) for the authenticated user
      operationId: createGadget
      requestBody:
        $ref: './components/users/requests.yaml#/GadgetCreateRequest'
      responses:
        '200':
          $ref: './components/users/responses.yaml#/GadgetCreatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '409':
          $ref: './components/auth/registration/errors.yaml#/GadgetAlreadyExistsError'
    delete:
      tags: [ Users ]
      summary: Delete user gadget
      description: Deletes a user's gadget by identifier. Cannot delete the last verified gadget.
      operationId: deleteGadget
      requestBody:
        $ref: './components/users/requests.yaml#/GadgetDeleteRequest'
      responses:
        '200':
          $ref: './components/users/responses.yaml#/GadgetDeletedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /notifications/:
    get:
      tags: [ Notifications ]
      summary: List notifications
      description: Returns a paginated list of user's notifications
      operationId: listNotifications
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
        - $ref: './components/notifications/parameters.yaml#/NotificationTypesParam'
        - $ref: './components/notifications/parameters.yaml#/NotificationStatusParam'
        - $ref: './components/notifications/parameters.yaml#/NotificationCreatedAtFromParam'
        - $ref: './components/notifications/parameters.yaml#/NotificationCreatedAtToParam'
        - $ref: './components/notifications/parameters.yaml#/NotificationCreatedByParam'
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/NotificationsListResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /notifications/{notification_id}/:
    get:
      tags: [ Notifications ]
      summary: Get notification details
      description: Returns detailed information about a specific notification
      operationId: getNotificationDetails
      parameters:
        - $ref: './components/notifications/parameters.yaml#/NotificationIdParameter'
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/NotificationDetailResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /notifications/{notification_id}/status/:
    patch:
      tags: [ Notifications ]
      summary: Update notification status
      description: Updates the status of a notification (mark as read)
      operationId: updateNotificationStatus
      parameters:
        - $ref: './components/notifications/parameters.yaml#/NotificationIdParameter'
      requestBody:
        $ref: './components/notifications/requests.yaml#/NotificationStatusUpdateRequest'
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/NotificationStatusUpdatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /notifications/settings/:
    get:
      tags: [ Notifications ]
      summary: List notification settings
      description: Returns the user's notification settings for all notification types
      operationId: listNotificationSettings
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/NotificationSettingsListResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
    put:
      tags: [ Notifications ]
      summary: Update notification settings
      description: Updates the user's notification settings for specific notification types
      operationId: updateNotificationSettings
      requestBody:
        $ref: './components/notifications/requests.yaml#/NotificationSettingsUpdateRequest'
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/NotificationSettingsUpdatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /notifications/devices/:
    get:
      tags: [ Notifications ]
      summary: List push notification devices
      description: Returns a list of user's registered push notification devices
      operationId: listNotificationDevices
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/DevicesListResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
    post:
      tags: [ Notifications ]
      summary: Add push notification device
      description: Registers a new push notification device for the user
      operationId: addNotificationDevice
      requestBody:
        $ref: './components/notifications/requests.yaml#/DeviceAddRequest'
      responses:
        '200':
          $ref: './components/notifications/responses.yaml#/DeviceAddedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /harvest-seasons/:
    get:
      tags: [ Harvest Seasons ]
      summary: List harvest seasons
      description: |
        Returns harvest seasons available to the authenticated participant, ordered by
        start_date descending. A season covers whole commodity groups. All commodities within a group share
        its seasons, which never overlap and have at most one active season per group. Administrators must
        configure an active season before recording a new harvest without an explicit season. Different
        groups may have different active seasons; clients can select a group with commodity_group_id.
        "All harvest seasons" is a client-only option, expressed by omitting
        harvest_season_id from filtered requests.
      operationId: listHarvestSeasons
      parameters:
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonCommodityIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonCommodityGroupIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonStatusParameter'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
      responses:
        '200':
          $ref: './components/harvest_seasons/responses.yaml#/HarvestSeasonsListResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /commodities/:
    get:
      tags: [ Commodities ]
      summary: List commodities
      description: Returns a paginated list of available commodities
      deprecated: true
      operationId: listCommodities
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
        - $ref: './components/commodities/parameters.yaml#/CommodityGroupIdParameter'
      responses:
        '200':
          $ref: './components/commodities/responses.yaml#/CommoditiesListResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /commodities/groups/:
    get:
      tags: [ Commodities ]
      summary: List commodities groups
      description: |
        Returns a paginated list of available commodity groups and their commodities with the user's
        balances. Season filters apply to the balances; groups and commodities remain in the catalogue
        even if no matching balance exists. With no season filters, balances are summed across all seasons.
        Use /commodities/balances/ for separate rows per season and their traceability.
      operationId: listCommoditiesGroups
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/BalanceHarvestSeasonIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/BalanceHarvestSeasonStatusParameter'
      responses:
        '200':
          $ref: './components/commodities/responses.yaml#/CommoditiesGroupsListResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /commodities/balances/:
    get:
      tags: [ Commodities ]
      summary: List user balances
      description: |
        Returns a paginated flat list of user's commodity balances. Each item represents one commodity and
        harvest season pair, only non-zero balances are returned and volumes of different seasons are never
        summed. Set commodity_id without harvest_season_id to get the season breakdown behind one catalogue
        row, which is the balance detail screen, and harvest_season_status active to list what the
        participant holds in every running season at once. Rows are ordered by the most recent season first
        unless orderings says otherwise.
      operationId: listBalances
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
        - $ref: './components/commodities/parameters.yaml#/BalancesOrderingsParameter'
        - $ref: './components/commodities/parameters.yaml#/CommodityGroupIdParameter'
        - $ref: './components/commodities/parameters.yaml#/CommodityIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/BalanceHarvestSeasonIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/BalanceHarvestSeasonStatusParameter'
      responses:
        '200':
          $ref: './components/commodities/responses.yaml#/BalanceListResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /transactions/:
    get:
      tags: [ Transactions ]
      summary: List transactions
      description: |
        Returns a paginated list of transactions. Filtering by harvest_season_id returns the transactions of
        that season; omitting it returns everything. Every transaction carries a season, pending
        buyer-created requests included. Combined with commodity_id it backs the source transactions block of
        the balance detail screen.

        Without group_conversions every item is a TransactionDTO and a conversion appears as one row per input and
        output. With group_conversions=true a conversion is one ConversionTransactionDTO item; tell the two apart by
        the inputs field.
      operationId: listTransactions
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
        - $ref: './components/transactions/parameters.yaml#/OrderingsParameter'
        - $ref: './components/transactions/parameters.yaml#/TypeParameter'
        - $ref: './components/transactions/parameters.yaml#/GroupConversionsParameter'
        - $ref: './components/transactions/parameters.yaml#/StatusParameter'
        - $ref: './components/transactions/parameters.yaml#/ActionParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtFromParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtToParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityGroupIdParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityIdParameter'
        - $ref: './components/transactions/parameters.yaml#/BuyerIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonStatusFilterParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionListResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /transactions/download/csv/:
    get:
      tags: [ Transactions ]
      summary: Download filtered transactions as CSV
      description: |
        Downloads CSV file containing filtered transactions data based on query parameters. One row per
        transaction, each carrying the id, name, start date, end date and status of its harvest season.
        group_conversions never merges rows here: a conversion stays one row per input and output. It only
        makes action=buying and action=selling leave conversions out, as in the list.
        With include_chain the file also holds the upstream history of those transactions and a Tier column.
      operationId: downloadTransactionListCsv
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/transactions/parameters.yaml#/IncludeChainParameter'
        - $ref: './components/transactions/parameters.yaml#/TypeParameter'
        - $ref: './components/transactions/parameters.yaml#/GroupConversionsParameter'
        - $ref: './components/transactions/parameters.yaml#/StatusParameter'
        - $ref: './components/transactions/parameters.yaml#/ActionParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtFromParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtToParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityGroupIdParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityIdParameter'
        - $ref: './components/transactions/parameters.yaml#/BuyerIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonStatusFilterParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionListCsvDownloadResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /transactions/download/bundle/:
    get:
      tags: [ Transactions ]
      summary: Download farm geodata for the filtered transactions
      description: |
        Downloads one ZIP bundle with the farm geodata behind every chain of the filtered transactions, using
        the contents and counts of the per-transaction bundle. It takes the filters of the CSV download, so
        details, geolocations and both cover the same transactions. A farm reached through several
        transactions appears once in the zip and once in the counts.
      operationId: downloadTransactionListLocationBundle
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/transactions/parameters.yaml#/TypeParameter'
        - $ref: './components/transactions/parameters.yaml#/GroupConversionsParameter'
        - $ref: './components/transactions/parameters.yaml#/StatusParameter'
        - $ref: './components/transactions/parameters.yaml#/ActionParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtFromParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtToParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityGroupIdParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityIdParameter'
        - $ref: './components/transactions/parameters.yaml#/BuyerIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonStatusFilterParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionListLocationBundleDownloadResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /transactions/download/summary/:
    get:
      tags: [ Transactions ]
      summary: Farm and trader counts for the filtered transactions
      description: |
        Returns the numbers the download modal shows before the download starts: farms with full traceability,
        farms added by hand, farms with no geodata, and how many traders the filtered transactions involve.
        The numbers equal the headers of the bundle download made with the same filters, and the endpoint
        opens no stored file.
      operationId: getTransactionListLocationSummary
      parameters:
        - $ref: './components/common/parameters.yaml#/SearchParameter'
        - $ref: './components/transactions/parameters.yaml#/TypeParameter'
        - $ref: './components/transactions/parameters.yaml#/GroupConversionsParameter'
        - $ref: './components/transactions/parameters.yaml#/StatusParameter'
        - $ref: './components/transactions/parameters.yaml#/ActionParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtFromParameter'
        - $ref: './components/transactions/parameters.yaml#/CreatedAtToParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityGroupIdParameter'
        - $ref: './components/transactions/parameters.yaml#/CommodityIdParameter'
        - $ref: './components/transactions/parameters.yaml#/BuyerIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonIdParameter'
        - $ref: './components/harvest_seasons/parameters.yaml#/HarvestSeasonStatusFilterParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionListLocationSummaryResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /transactions/producer/:
    post:
      tags: [ Transactions ]
      summary: Create producer transaction
      description: |
        Creates a new producer transaction where the authenticated user is the buyer. harvest_season_id is
        optional and defaults to the active season covering the commodity; a commodity without an active
        season returns 409, and a season that does not cover the commodity returns 400. Volume from two
        seasons is recorded with two transactions.
      operationId: createProducerTransaction
      requestBody:
        $ref: './components/transactions/requests.yaml#/TransactionProducerCreateRequest'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionCreatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '409':
          $ref: './components/harvest_seasons/errors.yaml#/HarvestSeasonConflictError'

  /transactions/downstream/:
    post:
      tags: [ Transactions ]
      summary: Create downstream transaction
      description: |
        Creates a new downstream transaction where the authenticated user can be either buyer or seller. A
        recipient named by User ID must belong to a live account: an unknown or deleted one is refused with
        404 transactions.recipient_not_found, naming the recipient field.
        harvest_season_id is required from both sides: a buyer states the season it wants to buy from and
        the seller can only accept or reject that request as it stands. Balances
        are not checked here, so a request the seller cannot cover is created normally and fails on
        acceptance instead, which keeps the seller balance private.
      operationId: createDownstreamTransaction
      requestBody:
        $ref: './components/transactions/requests.yaml#/TransactionDownstreamCreateRequest'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionCreatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '409':
          $ref: './components/harvest_seasons/errors.yaml#/HarvestSeasonConflictError'

  /transactions/conversion/:
    get:
      tags: [ Transactions ]
      summary: List conversion recipes
      description: Returns a paginated list of conversion recipes
      operationId: listConversionRecipes
      parameters:
        - $ref: './components/conversions/parameters.yaml#/ConversionRecipeSearchParam'
        - $ref: './components/conversions/parameters.yaml#/ConversionRecipeCommodityIdParam'
        - $ref: './components/common/parameters.yaml#/PageParameter'
        - $ref: './components/common/parameters.yaml#/PageSizeParameter'
      responses:
        '200':
          $ref: './components/conversions/responses.yaml#/ConversionRecipesListResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
    post:
      tags: [ Transactions ]
      summary: Create conversion transaction
      description: |
        Creates conversion transactions to transform input commodities into output commodities.
        harvest_season_id is required and must cover every input and output commodity of the recipe;
        a commodity outside it returns 400 and insufficient balance in that season returns 409.
        Returns the created conversion, so an offline client can replace its placeholder.
      operationId: createConversionTransaction
      requestBody:
        $ref: './components/transactions/requests.yaml#/ConversionCreateRequest'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/ConversionCompletedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '409':
          $ref: './components/harvest_seasons/errors.yaml#/HarvestSeasonConflictError'

  /transactions/conversion/{group_id}/:
    get:
      tags: [ Transactions ]
      summary: Get conversion details
      description: Returns one conversion with all of its inputs and outputs. Only its owner can read it.
      operationId: getConversionDetails
      parameters:
        - $ref: './components/transactions/parameters.yaml#/GroupIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/ConversionDetailResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /transactions/{transaction_id}/:
    get:
      tags: [ Transactions ]
      summary: Get transaction details
      description: Returns detailed information about a specific transaction
      operationId: getTransactionDetails
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionDetailResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /transactions/{transaction_id}/traceability-counts/:
    get:
      tags: [ Transactions ]
      summary: Get transaction traceability counts
      description: |
        Returns traceability counts for a specific transaction. The response shape is unchanged but the
        counts cover the chain of that transaction's harvest season only, because a chain never crosses a
        season boundary.
      operationId: getTransactionTraceabilityCounts
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionTraceabilityCountsResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /transactions/{transaction_id}/status/:
    patch:
      tags: [ Transactions ]
      summary: Update transaction status
      description: |
        Updates the status of a pending transaction (accept or reject). The request carries only status:
        the season was fixed when the transaction was created and acceptance never selects or splits one;
        sending season fields here is a 400. The seller balance of that season is revalidated on
        acceptance. In an active season a shortfall is covered by an automatic balance adjustment, returned
        alongside the transaction. In a past or archived season it returns 409, and the seller either raises
        the balance and accepts later, or rejects and creates its own transaction for the volume it holds.
      operationId: updateTransactionStatus
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      requestBody:
        $ref: './components/transactions/requests.yaml#/TransactionStatusUpdateRequest'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionStatusUpdatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '409':
          $ref: './components/harvest_seasons/errors.yaml#/HarvestSeasonConflictError'

  /transactions/{transaction_id}/geodata/:
    patch:
      tags: [ Transactions ]
      summary: Update transaction geodata
      description: Updates the location source and uploads geodata file for a transaction
      operationId: updateTransactionGeodata
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      requestBody:
        $ref: './components/transactions/requests.yaml#/TransactionGeodataUpdateRequest'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionGeodataUpdatedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /transactions/{transaction_id}/geodata/request/:
    post:
      tags: [ Transactions ]
      summary: Request missing geodata
      description: Request missing geodata for a transaction
      operationId: requestMissingGeodata
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionGeodataRequestedResponse'
        '400':
          $ref: './components/common/errors.yaml#/BadRequestError'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /transactions/{transaction_id}/download/geojson/:
    get:
      tags: [ Transactions ]
      summary: Download transaction chain feature collection
      description: Downloads GeoJSON feature collection data for the entire transaction chain
      operationId: downloadTransactionChain
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/ChainFeatureCollectionDownloadResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '500':
          $ref: './components/common/errors.yaml#/InternalServerError'

  /transactions/{transaction_id}/download/csv/:
    get:
      tags: [ Transactions ]
      summary: Download transaction chain as CSV
      description: |
        Downloads CSV file containing all transactions data in the transaction chain, with the harvest
        season columns of the list export. The chain covers one season, since a chain never crosses a
        season boundary.
      operationId: downloadTransactionChainCsv
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/ChainCsvDownloadResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '500':
          $ref: './components/common/errors.yaml#/InternalServerError'

  /transactions/{transaction_id}/download/bundle/:
    get:
      tags: [ Transactions ]
      summary: Download transaction chain bundle
      description: |
        Downloads a ZIP bundle with the farm geodata behind the transaction chain. It covers the farms of the
        chain only, which are the producer transactions with no seller; the trades between them carry no
        geodata and are left out of the zip and of the three counts. Each farm falls into exactly one count,
        by its location: qr and gps have full traceability, file and manual were added by hand, and a farm
        with no location has no geodata at all. The zip holds the stored geojson of every qr farm, the
        uploaded file of every file farm, and merged.geojson with the qr features plus one Point per gps and
        manual farm. A farm whose stored file is missing or unreadable keeps its count and is left out of the
        zip.
      operationId: downloadTransactionChainBundle
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/ChainBundleDownloadResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'
        '500':
          $ref: './components/common/errors.yaml#/InternalServerError'

  /transactions/{transaction_id}/notification/resend/:
    post:
      tags: [ Transactions ]
      summary: Resend transaction notification
      description: Resends a pending transaction notification
      operationId: resendTransactionNotification
      parameters:
        - $ref: './components/transactions/parameters.yaml#/TransactionIdParameter'
      responses:
        '200':
          $ref: './components/transactions/responses.yaml#/TransactionNotificationResentResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'
        '404':
          $ref: './components/common/errors.yaml#/NotFoundError'

  /analytics/:
    get:
      tags: [ Analytics ]
      summary: Get analytics data
      description: Returns comprehensive analytics data including KPIs, balance summary, traceability statistics, and user growth data
      operationId: getAnalytics
      responses:
        '200':
          $ref: './components/analytics/responses.yaml#/AnalyticsResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'
        '403':
          $ref: './components/common/errors.yaml#/ForbiddenError'

  /analytics/user/:
    get:
      tags: [ Analytics ]
      summary: Get user analytics
      description: Returns user-specific analytics metrics including transaction counts, supplier relationships, supply chain traceability, and file uploads
      operationId: getUserAnalytics
      responses:
        '200':
          $ref: './components/analytics/responses.yaml#/UserAnalyticsResponse'
        '401':
          $ref: './components/common/errors.yaml#/UnauthorizedError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: [ ]
