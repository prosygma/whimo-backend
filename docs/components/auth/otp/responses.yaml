OTPVerifiedResponse:
  description: OTP verification successful
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../../common/schemas.yaml#/BaseResponse'
          - type: object
            properties:
              message:
                type: string
                default: Gadget verified

OTPSentResponse:
  description: OTP code sent successfully
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../../common/schemas.yaml#/BaseResponse'
          - type: object
            properties:
              message:
                type: string
                default: Verification code sent
              channel:
                type: string
                enum: [email, sms, whatsapp]
                description: >-
                  How the code was delivered. Phone codes use `whatsapp` when WhatsApp is
                  configured and enabled in the admin, `sms` otherwise.

PasswordResetSentResponse:
  description: Password reset code sent successfully
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../../common/schemas.yaml#/BaseResponse'
          - type: object
            properties:
              message:
                type: string
                default: Reset code sent
              channel:
                type: string
                enum: [email, sms, whatsapp]
                description: >-
                  How the code was delivered. Phone codes use `whatsapp` when WhatsApp is
                  configured and enabled in the admin, `sms` otherwise.

PasswordResetOTPValidResponse:
  description: Verification code is valid
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../../common/schemas.yaml#/BaseResponse'
          - type: object
            properties:
              message:
                type: string
                default: Verification code is valid

PasswordResetResponse:
  description: Password reset successful
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../../common/schemas.yaml#/BaseResponse'
          - type: object
            properties:
              message:
                type: string
                default: Password reset
