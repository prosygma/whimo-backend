TypeParameter:
  name: type
  in: query
  schema:
    $ref: './schemas.yaml#/TransactionType'
  description: Filter transactions by type. type=conversion backs the Conversion tab.

GroupConversionsParameter:
  name: group_conversions
  in: query
  schema:
    type: boolean
    default: false
  description: |
    Return each conversion as one ConversionTransactionDTO item instead of one row per input and output.
    Pagination counts these items. With this flag, action=buying and action=selling exclude conversions.
    Search, commodity, commodity group and harvest season filters match a conversion when any of its inputs or
    outputs match. Sorting by commodity_name or amount uses the largest output. A conversion without group_id
    still appears as separate rows.

GroupIdParameter:
  name: group_id
  in: path
  schema:
    type: string
    format: uuid
  description: Identifier of the conversion (group_id)
  required: true

IncludeChainParameter:
  name: include_chain
  in: query
  schema:
    type: boolean
    default: false
  description: |
    Add the upstream history behind the filtered transactions: every supplier transaction their chains reach,
    one row each however many chains reach it. The file then carries a Tier column, 0 for the user's own rows,
    1 for their suppliers, and so on, taking the shortest way to one of the user's transactions.

StatusParameter:
  name: status
  in: query
  schema:
    $ref: './schemas.yaml#/TransactionStatus'
  description: Filter transactions by status

ActionParameter:
  name: action
  in: query
  schema:
    $ref: './schemas.yaml#/TransactionAction'
  description: Filter transactions by action (buying or selling)

CreatedAtFromParameter:
  name: created_at_from
  in: query
  schema:
    type: string
    format: date-time
  description: Filter transactions created after this timestamp

CreatedAtToParameter:
  name: created_at_to
  in: query
  schema:
    type: string
    format: date-time
  description: Filter transactions created before this timestamp

CommodityGroupIdParameter:
  name: commodity_group_id
  in: query
  schema:
    type: string
    format: uuid
  description: Unique identifier of the commodity group

CommodityIdParameter:
  name: commodity_id
  in: query
  schema:
    type: string
    format: uuid
  description: Filter by commodity ID

BuyerIdParameter:
  name: buyer_id
  in: query
  schema:
    type: string
    format: uuid
  description: |
    Unique identifier of the transaction buyer_id
    
    Note: parameter can be used only with `commodity_group_id` and `status=ACCEPTED` for privacy

TransactionIdParameter:
  name: transaction_id
  in: path
  schema:
    type: string
    format: uuid
  description: Unique identifier of the transaction
  required: true

OrderingsParameter:
  name: orderings
  in: query
  schema:
    type: array
    items:
      type: string
      enum:
        - commodity_name
        - -commodity_name
        - amount
        - -amount
        - created_at
        - -created_at
      description: Order by field
