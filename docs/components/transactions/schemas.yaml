TransactionAction:
  description: Action in the transaction (buying or selling)
  type: string
  enum:
    - buying
    - selling

TransactionType:
  description: Type of transaction
  type: string
  enum:
    - producer
    - downstream
    - conversion

TransactionLocation:
  description: Source of location geodata
  type: string
  enum:
    - qr
    - manual
    - file
    - gps

TransactionStatus:
  description: Status of the transaction
  type: string
  enum:
    - pending
    - accepted
    - rejected
    - no_response

TransactionTraceability:
  description: Transaction traceability status
  type: string
  enum:
    - full
    - conditional
    - partial
    - incomplete

TransactionDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier for the transaction
    created_at:
      type: string
      format: date-time
      description: Timestamp when the transaction was created
    type:
      $ref: '#/TransactionType'
      description: Type of transaction
    status:
      $ref: '#/TransactionStatus'
      description: Status of the transaction
    action:
      $ref: '#/TransactionAction'
      description: Action in the transaction for the current user (buying or selling)
    location:
      $ref: '#/TransactionLocation'
      description: Source of location geodata
      nullable: true
    transaction_latitude:
      type: number
      format: double
      description: Latitude coordinate where the transaction takes place
      examples: [ 51.507222 ]
      nullable: true
    transaction_longitude:
      type: number
      format: double
      description: Longitude coordinate where the transaction takes place
      examples: [ -0.1275 ]
      nullable: true
    farm_latitude:
      type: number
      format: double
      description: Latitude coordinate of the farm where the commodity originates
      examples: [ 51.485 ]
      nullable: true
    farm_longitude:
      type: number
      format: double
      description: Longitude coordinate of the farm where the commodity originates
      examples: [ -0.145 ]
      nullable: true
    commodity:
      $ref: '../commodities/schemas.yaml#/CommodityWithGroupDTO'
      description: Commodity being traded
    volume:
      type: number
      format: double
      description: |
        Volume as stored. Its sign differs by type: conversion inputs are negative, a downstream sale is positive.
        Use signed_volume to print +/-.
    signed_volume:
      type: number
      format: double
      description: |
        Volume from the current user's side: positive when it enters the user's balance (purchase, producer
        transaction, automatic adjustment, conversion output), negative when it leaves (sale, conversion input).
        Positive when the user is neither buyer nor seller, which happens only with the buyer_id filter.
      examples: [ -500 ]
    is_buying_from_farmer:
      type: boolean
      description: Whether the transaction is buying from a farmer directly
    is_automatic:
      type: boolean
      description: Whether the transaction is automatic
    expires_at:
      type: string
      format: date-time
      description: Timestamp when the transaction expires
      nullable: true
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the transaction was last updated
    traceability:
      $ref: '#/TransactionTraceability'
      description: Transaction traceability status
      nullable: true
    seller:
      $ref: '../users/schemas.yaml#/UserDTO'
      description: Seller information
      nullable: true
    buyer:
      $ref: '../users/schemas.yaml#/UserDTO'
      description: Buyer information
      nullable: true
    harvest_season:
      $ref: '../harvest_seasons/schemas.yaml#/HarvestSeasonDTO'
      description: |
        Harvest season the transaction belongs to. A transaction carries exactly one season, set by whoever
        created it and never changed, so the field is present on pending transactions too. Volume stays
        inside this season along the whole chain.
    created_by_id:
      type: string
      format: uuid
      description: ID of the user who created the transaction
      nullable: true

LocationSummaryDTO:
  type: object
  description: |
    The numbers the download modal shows before anything is downloaded. They count the farms behind the
    filtered transactions, each farm once, and match the headers of the bundle download made with the same
    filters. Read from the database alone, without opening a single stored file.
  properties:
    full_traceability_farms:
      type: integer
      description: Farms located by qr or gps
    manually_added_farms:
      type: integer
      description: Farms located by an uploaded file or a point on the map
    farms_without_geolocation:
      type: integer
      description: Farms with no geodata at all
    traders:
      type: integer
      description: Distinct counterparties across the filtered transactions, the user aside

TraceabilityCountsDTO:
  type: object
  properties:
    counts:
      type: object
      description: Dictionary mapping traceability status to count
      additionalProperties:
        type: integer
      example:
        "full": 15
        "conditional": 8
        "partial": 5
        "incomplete": 2

RecipientDTO:
  allOf:
    - $ref: '../auth/registration/schemas.yaml#/CreateUserDTO'
    - type: object
      properties:
        name:
          type: string
          description: User's name
          example: a7e3ca


TransactionCreateBaseDTO:
  description: Base DTO for creating a transaction
  type: object
  required:
    - commodity_id
    - volume
  properties:
    commodity_id:
      type: string
      format: uuid
      description: ID of the commodity being traded
    volume:
      type: number
      format: double
      description: Volume of commodities
      examples: [ 10.5 ]
    transaction_latitude:
      type: number
      format: double
      description: Latitude coordinate where the transaction takes place
      examples: [ 51.507222 ]
      nullable: true
    transaction_longitude:
      type: number
      format: double
      description: Longitude coordinate where the transaction takes place
      examples: [ -0.1275 ]
      nullable: true
    recipient:
      $ref: './schemas.yaml#/RecipientDTO'
      description: Transaction recipient information
      nullable: true

FeatureProperties:
  type: object
  description: |
    Properties of a GeoJSON feature. Keys are PascalCase, and properties of an uploaded location file
    that the API does not name are passed through unchanged.
  additionalProperties: true
  properties:
    ProducerName:
      type: string
      nullable: true
      description: Name of the producer
      example: "Farm Producer Inc"
    ProducerCountry:
      type: string
      nullable: true
      description: Country of the producer
      example: "Brazil"
    ProductionPlace:
      type: string
      nullable: true
      description: Place of production
      example: "São Paulo Region"
    TransactionId:
      type: string
      nullable: true
      description: Transaction the feature was collected for
      example: "12345678-1234-5678-9abc-123456789def"

PolygonGeometry:
  type: object
  description: Polygon geometry of a GeoJSON feature
  properties:
    type:
      type: string
      description: Geometry type
      enum: [ Polygon ]
    coordinates:
      type: array
      description: Polygon coordinates, positions optionally carrying elevation
      items:
        type: array
        items:
          type: array
          items:
            type: number
            format: double
      example: [ [ [ -122.4194, 37.7749 ] ] ]

PointGeometry:
  type: object
  description: Point geometry of a GeoJSON feature
  properties:
    type:
      type: string
      description: Geometry type
      enum: [ Point ]
    coordinates:
      type: array
      description: Point coordinates, optionally carrying elevation
      items:
        type: number
        format: double
      example: [ -122.4194, 37.7749 ]

FeatureGeometry:
  description: Geometry of a GeoJSON feature, discriminated by its type
  oneOf:
    - $ref: '#/PolygonGeometry'
    - $ref: '#/PointGeometry'

Feature:
  type: object
  description: A GeoJSON feature
  properties:
    type:
      type: string
      description: Feature type
      enum: [ Feature ]
    geometry:
      $ref: '#/FeatureGeometry'
    properties:
      $ref: '#/FeatureProperties'

FeatureCollection:
  type: object
  description: A GeoJSON feature collection
  properties:
    type:
      type: string
      description: Collection type
      enum: [ FeatureCollection ]
    features:
      type: array
      description: Array of features
      items:
        $ref: '#/Feature'

ChainFeatureCollectionDTO:
  type: object
  description: Transaction chain feature collection data
  properties:
    feature_collection:
      $ref: '#/FeatureCollection'
      description: GeoJSON feature collection containing location data
    succeed_transactions:
      type: array
      description: List of transaction IDs that succeed to process
      items:
        type: string
        format: uuid
      example: [ "123e4567-e89b-12d3-a456-426614174000" ]
    failed_transactions:
      type: array
      description: List of transaction IDs that failed to process
      items:
        type: string
        format: uuid
      example: [ "123e4567-e89b-12d3-a456-426614174000" ]

CommodityQuantityOverride:
  type: object
  description: Override quantity for a commodity defined in a recipe
  required:
    - commodity_id
    - quantity
  properties:
    commodity_id:
      type: string
      format: uuid
      description: ID of the commodity to override
      example: "123e4567-e89b-12d3-a456-426614174000"
    quantity:
      type: number
      format: double
      description: Override quantity to use in conversion
      minimum: 0
      example: 25.0
