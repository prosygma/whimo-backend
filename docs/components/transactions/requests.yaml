TransactionProducerCreateRequest:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        allOf:
          - $ref: './schemas.yaml#/TransactionCreateBaseDTO'
          - properties:
              is_buying_from_farmer:
                type: boolean
                description: Whether this transaction is buying from a farmer directly
                default: false
              farm_latitude:
                type: number
                format: double
                description: Latitude coordinate of the farm where the commodity originates
                examples: [ 51.485 ]
                nullable: true
              farm_longitude:
                type: number
                format: double
                description: Longitude coordinate of the farm where the commodity originates
                examples: [ -0.145 ]
                nullable: true
              location:
                $ref: './schemas.yaml#/TransactionLocation'
                description: Source of location geodata
                nullable: true
              location_file:
                type: string
                format: binary
                description: Location file
                nullable: true
              harvest_season_id:
                type: string
                format: uuid
                description: |
                  Harvest season the volume is recorded in. Optional; omitted, the backend assigns the
                  active season covering the commodity. Past and archived seasons are accepted. Must cover
                  the transaction commodity. One transaction carries one season.
                nullable: true

TransactionDownstreamCreateRequest:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - action
        allOf:
          - $ref: './schemas.yaml#/TransactionCreateBaseDTO'
          - properties:
              action:
                $ref: './schemas.yaml#/TransactionAction'
                description: Action in the transaction (buying or selling)
              harvest_season_id:
                type: string
                format: uuid
                description: |
                  Required for both actions; the creator of the transaction chooses the season and it is
                  never changed afterwards. Must cover the transaction commodity. Past and
                  archived seasons are accepted. One transaction carries one season, so volume held in two
                  seasons needs two separate transactions; there is no partial distribution between seasons.
                  A buyer-created request is not validated against the seller balance, which stays private
                  until the seller accepts.

TransactionStatusUpdateRequest:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - status
        properties:
          status:
            type: string
            description: New status for the transaction (only accepted or rejected allowed)
            enum:
              - accepted
              - rejected

TransactionGeodataUpdateRequest:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - location
          - location_file
        properties:
          location:
            $ref: './schemas.yaml#/TransactionLocation'
            description: Source of location geodata
          location_file:
            type: string
            format: binary
            description: Location file

ConversionCreateRequest:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - recipe_id
          - harvest_season_id
        properties:
          recipe_id:
            type: string
            format: uuid
            description: ID of the conversion recipe to use
          harvest_season_id:
            type: string
            format: uuid
            description: |
              Harvest season the conversion runs in. Required, and must cover every input and output
              commodity of the recipe. Inputs are debited from it and outputs credited to it, so a
              conversion never moves volume between seasons and never creates an automatic balance
              adjustment.
          input_overrides:
            type: array
            description: Optional overrides for input commodities defined in the recipe
            items:
              $ref: './schemas.yaml#/CommodityQuantityOverride'
          output_overrides:
            type: array
            description: Optional overrides for output commodities defined in the recipe
            items:
              $ref: './schemas.yaml#/CommodityQuantityOverride'
