CommodityGroupDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier for the commodity group
    name:
      type: string
      description: Name of the commodity group
      examples: [ Cocoa ]

CommodityGroupWithCommoditiesBalancesDTO:
  allOf:
    - $ref: '#/CommodityGroupDTO'
    - type: object
      properties:
        commodities:
          type: array
          items:
            $ref: '#/CommodityWithBalanceDTO'
          description: List of commodities in this group with user balances

CommodityDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier for the commodity
    code:
      type: string
      description: Commodity code
      examples: [ '1801' ]
    name:
      type: string
      description: Name of the commodity
      examples: [ 'Cocoa beans, whole or broken, raw or roasted' ]
    unit:
      type: string
      description: Unit of measurement
      examples: [ kg ]
    has_recipe:
      type: boolean
      description: Whether the commodity has a conversion recipe

CommodityWithGroupDTO:
  allOf:
    - $ref: '#/CommodityDTO'
    - type: object
      properties:
        group:
          $ref: '#/CommodityGroupDTO'
          description: Commodity group this commodity belongs to

CommodityWithBalanceDTO:
  allOf:
    - $ref: '#/CommodityWithGroupDTO'
    - type: object
      properties:
        balance:
          type: number
          format: double
          nullable: true
          description: |
            User balance summed within the requested harvest season and status filters, or across all
            seasons when both filters are omitted. Null if no matching balance exists.
            Use /commodities/balances/ for separate rows per season and their traceability.

BalanceDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier for the balance
    volume:
      type: number
      format: double
      description: Current balance volume
    commodity:
      $ref: '../commodities/schemas.yaml#/CommodityWithGroupDTO'
      description: Commodity information
    harvest_season:
      $ref: '../harvest_seasons/schemas.yaml#/HarvestSeasonDTO'
      description: |
        Harvest season this balance belongs to. One item represents one commodity and harvest season pair;
        volumes of different seasons are never summed by the API.
    traceability:
      $ref: '../transactions/schemas.yaml#/TransactionTraceability'
      description: |
        Worst traceability among the holder's accepted incoming transactions of this commodity in this
        season. Selling and a season status change do not reset this history. An automatic balance
        adjustment is incomplete and contributes to this status. A balance with no accepted incoming
        transactions reads incomplete.
    has_recipe:
      type: boolean
      description: Whether the commodity has a conversion recipe
