{% load i18n %}

<div x-data="{ rows: [] }" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
    <input type="hidden" name="{{ widget.name }}" value="">

    {% for code, text in widget.rows %}
        <div class="max-w-2xl" style="display: flex; flex-direction: row; gap: 8px; align-items: center; width: 100%;">
            <select name="{{ widget.name }}_language" class="{{ widget.select_class }}" style="width: 12rem; flex: 0 0 auto;">
                {% for language_code, language_label in widget.languages %}
                    <option value="{{ language_code }}" {% if language_code == code %}selected{% endif %}>{{ language_label }}</option>
                {% endfor %}
            </select>

            <input type="text" name="{{ widget.name }}_value" value="{{ text }}" class="{{ widget.input_class }}" style="flex: 1 1 auto; min-width: 0; max-width: none;">

            <a x-on:click="$el.parentElement.remove()" class="bg-white border border-base-200 cursor-pointer flex items-center h-[38px] justify-center rounded-default shadow-xs shrink-0 text-red-600 text-sm w-[38px] dark:bg-base-900 dark:border-base-700 dark:text-red-500">
                <span class="material-symbols-outlined">delete</span>
            </a>
        </div>
    {% endfor %}

    <template x-for="row in rows" :key="row.key">
        <div style="display: flex; flex-direction: row; gap: 8px; align-items: center; width: 100%;">
            <select name="{{ widget.name }}_language" class="{{ widget.select_class }}" style="width: 12rem; flex: 0 0 auto;">
                {% for language_code, language_label in widget.languages %}
                    <option value="{{ language_code }}">{{ language_label }}</option>
                {% endfor %}
            </select>

            <input type="text" name="{{ widget.name }}_value" value="" class="{{ widget.input_class }}" style="flex: 1 1 auto; min-width: 0; max-width: none;">

            <a x-on:click="rows.splice(rows.indexOf(row), 1)" class="bg-white border border-base-200 cursor-pointer flex items-center h-[38px] justify-center rounded-default shadow-xs shrink-0 text-red-600 text-sm w-[38px] dark:bg-base-900 dark:border-base-700 dark:text-red-500">
                <span class="material-symbols-outlined">delete</span>
            </a>
        </div>
    </template>

    <div style="display: flex;">
        <div x-on:click="rows.push({ key: new Date().getTime() })" class="bg-primary-600 border border-transparent cursor-pointer font-medium inline-block px-3 py-2 rounded-default text-center text-sm text-white">
            {% trans "Add translation" %}
        </div>
    </div>
</div>
